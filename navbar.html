<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #493d59;
            color: beige;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: beige;
            text-decoration: none;
        }

        .login button {
            border: 2px solid rgb(154, 137, 137);
            border-radius: 5px;
            height: 50px;
            width: 100px;
            color: white;
            background-color: transparent;
            cursor: pointer;
        }

        .foodcards {
            height: 300px;
            width: 300px;
            border: 1px solid #e8e8e8;
            border-radius: 5px;
            background-color: rgb(246, 225, 198);

            background-image: url("https://food.fnr.sndimg.com/content/dam/images/food/fullset/2024/03/20/GRILLED_SALMON_TACOS_H_f.jpg.rend.hgtvcom.406.305.85.suffix/1711029515005.webp");

            background-size: cover;
            background-position: center;
        }
        .foodcards {
    width: 300px;
    border: 1px solid #e8e8e8;
    border-radius: 5px;
    background-color: rgb(246, 225, 198);
    overflow: hidden;
}

.foodcards img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}

.foodcards h3 {
    padding: 15px;
    text-align: center;
}

    </style>
</head>

<body>

    <nav>

        <div class="logo">
            <h2>Ecommerce</h2>
        </div>

        <div class="nav-links">

            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact us</a>
            <a href="">Blogs</a>

            <div class="login">
                <button>Login</button>
            </div>

        </div>

    </nav>

    <div class="foodcards">
    </div>

</body>
</html>
